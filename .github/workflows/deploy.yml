name: Deploy to GitHub Pages
# Baut die App und veröffentlicht sie auf GitHub Pages: https://<nutzer>.github.io/<repository>/
# Einmalig nötig: im Repository unter Settings > Pages bei "Source" die Option "GitHub Actions" wählen.
on:
  push:
    branches: [main, claude/f1-dashboard-telemetry-76buoj] # main und der aktuelle Standardbranch des Repositories
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
